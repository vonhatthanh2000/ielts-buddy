[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-assistant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "openai>=1.0.0",
    "phidata>=2.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
]

[tool.vercel]
entrypoint = "main:app"

# Editable install (`pip install -e .`) puts the project root on sys.path so
# `from config import ...` works from any script (including under agents/).
[tool.setuptools]
py-modules = ["config"]
