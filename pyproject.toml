[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-assistant"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "phidata>=2.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "email-validator>=2.0.0",
]

# Editable install (`pip install -e .`) puts the project root on sys.path so
# `from config import ...` works from any script (including under agents/).
[tool.setuptools]
py-modules = ["config"]
